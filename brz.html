			{ "id": 2, "type": "複数選択", "question": "パーソナライゼーションとデータ取り込みを除外した場合、Brazeの垂直統合テックスタックを構成する残りの3つのレイヤーはどれですか？（3つ選択してください。）", "choices": { "A": "オーケストレーション（Orchestration）", "B": "アクション（Action）", "C": "セグメンテーション（Segmentation）", "D": "開発（Development）", "E": "分類（Classification）" }, "correct": ["A", "B", "E"], "explanation": "回答\nA. オーケストレーション\nB. アクション\nE. 分類\n解説\nBrazeの垂直統合テックスタックは、次のレイヤーで構成されます。\nデータ取り込み\n分類\nオーケストレーション\nパーソナライゼーション\nアクション\nエクスポート\n設問では「データ取り込み」と「パーソナライゼーション」を除外しているため、選択肢にある残りの該当レイヤーは 分類・オーケストレーション・アクション です。\nC. セグメンテーション は「分類」レイヤーで行う機能であり、独立したレイヤー名ではありません。\nD. 開発 はレイヤー名ではありません。", "links": [{ "text": "アーキテクチャ概要", "url": "https://www.braze.com/docs/developer_guide/getting_started/architecture_overview?utm_source=operator_user&utm_medium=dashboard" }] },

			{ "id": 6, "type": "単一選択", "question": "あなたは、キャンペーンを開始した後、ユーザーがキャンペーンを受け取った後に特定のイベントを実行した割合を測定したいと考えています。\nどの種類のレポートで、あなたが探しているインサイトを得ることができますか？", "choices": { "A": "リテンションレポート", "B": "エンゲージメントレポート", "C": "セグメントデータ", "D": "目標到達プロセスレポート" }, "correct": ["D"], "explanation": "回答\nD. 目標到達プロセスレポート\n解説\n目標到達プロセスレポートでは、最初のステップを「キャンペーンを受信」とし、その後に実行されたカスタムイベントや購入などを設定できます。\nそのため、キャンペーン受信後に特定イベントを実行したユーザーの割合を確認できます。イベントの実行順序と、キャンペーン受信後の評価期間も指定可能です。\nA は継続利用や再訪などの保持率を分析します。\nB はキャンペーンやCanvas全体の集計エンゲージメントを確認するレポートです。\nC はセグメント単位のセッション、イベント、収益データを扱います。", "links": [{ "text": "目標到達プロセスレポート", "url": "https://www.braze.com/docs/user_guide/analytics/reports/funnel_reports?utm_source=operator_user&utm_medium=dashboard" }] }, 
			{ "id": 7, "type": "複数選択", "question": "カスタムイベントプロパティに関するどの2つの声明が真実ですか？（2つ選択してください。）", "choices": { "A": "カスタムイベントプロパティは、キャンペーントリガーを特定し、コンバージョンを追跡し、メッセージをパーソナライズするために使用できます。", "B": "デフォルトでは、カスタムイベントプロパティはBraze SDKによって自動的にキャプチャされ、更新されます。", "C": "各カスタムイベントまたは購入イベントには、最大256の異なるカスタムイベントプロパティを持つことができます。", "D": "カスタムイベントプロパティは、業界やオーディエンスに関係なく、ブランドによって収集される事前定義された情報の断片です。" }, "correct": ["A", "C"], "explanation": "回答\nA. カスタムイベントプロパティは、トリガー条件の絞り込み、コンバージョン追跡、メッセージのパーソナライズに使用できます。\nC. 各カスタムイベントまたは購入イベントには、最大256個の異なるイベントプロパティを設定できます。\n解説\nイベントプロパティは、イベント発生時の詳細情報です。たとえば Added to Cart イベントに product_name、price、category などを付けられます。\nB は誤りです。イベントプロパティはSDKにより自動取得されるものではなく、SDKまたはAPIでイベント送信時に明示して渡します。\nD は誤りです。イベントプロパティはブランドが独自に定義するイベントごとのメタデータであり、事前定義された共通データではありません。", "links": [{ "text": "カスタムイベントプロパティ", "url": "https://www.braze.com/docs/user_guide/data/activation/events/custom_events/custom_event_properties?utm_source=operator_user&utm_medium=dashboard" }] },

			{ "id": 11, "type": "複数選択", "question": "あなたは、メールエンゲージメントのクリック率が低いことに気づきました。エンゲージメントを向上させるために、いくつかのテストを行いたいと考えています。どのテスト機能を利用できますか？（3つ選択してください。）", "choices": { "A": "パーソナライズバリアント", "B": "A/Bテスト", "C": "予測スイート（Predictive Suite）", "D": "インテリジェントスイート（Intelligence Suite）", "E": "Currents" }, "correct": ["A", "B", "D"], "explanation": "回答\nA. パーソナライズバリアント\nB. A/Bテスト\nD. インテリジェントスイート\n解説\nA/Bテスト: 件名、本文、CTA、配信時間などのバリアントを比較できます。\nパーソナライズバリアント: 初期テストの反応をもとに、各ユーザーが最もエンゲージしやすいバリアントを選択します。メールではクリック率を最適化指標にできます。\nインテリジェントスイート: Intelligent Selection などにより、複数バリアントの成果を自動で最適化できます。\nPredictive Suite は離脱やイベント発生の予測に使う機能です。\nCurrents はイベントデータを外部にストリーミングするデータエクスポート機能です。", "links": [{ "text": "A/Bテストの最適化", "url": "https://www.braze.com/docs/user_guide/messaging/ab_testing/optimizations?utm_source=operator_user&utm_medium=dashboard" }, { "text": "Intelligence Suite", "url": "https://www.braze.com/docs/user_guide/brazeai/intelligence_suite?utm_source=operator_user&utm_medium=dashboard" }] }, 
			{ "id": 12, "type": "単一選択", "question": "あなたはeコマース企業で働いています。あなたは、ロイヤルティプログラムに登録しているかどうかに基づいてユーザーをセグメント化したいと考えています。このカスタム属性データをBrazeにどのように保存すればよいですか？", "choices": { "A": "数値", "B": "日付", "C": "ブール値", "D": "配列" }, "correct": ["C"], "explanation": "回答\nC. ブール値\n解説\nロイヤルティプログラムへの登録有無は、true または false の二択で表せるため、ブール型のカスタム属性が適しています。\n例:\n\"loyalty_program_enrolled\": true\nこの属性を使い、登録済みユーザーと未登録ユーザーをセグメントできます。", "links": [{ "text": "カスタム属性", "url": "https://www.braze.com/docs/user_guide/data/activation/attributes/custom_attributes?utm_source=operator_user&utm_medium=dashboard" }] }, 
			{ "id": 13, "type": "複数選択", "question": "Braze Alloysのエコシステムポートフォリオに含まれる主要なテクノロジーカテゴリーはどれですか？（3つ選択してください。）", "choices": { "A": "ビジネスインテリジェンスと分析", "B": "アドテクとアトリビューション", "C": "Braze Currentsとレポーティング", "D": "簡単なアンケートとコンテンツカード", "E": "データウェアハウスと可視化" }, "correct": ["A", "B", "E"], "explanation": "回答\nA. ビジネスインテリジェンスと分析\nB. アドテクとアトリビューション\nE. データウェアハウスと可視化\n解説\nAlloysは、Brazeと連携するテクノロジーパートナーのエコシステムです。主な領域には、BI・分析、広告・アトリビューション、データウェアハウスなどが含まれます。\nC のCurrentsとレポーティング、D のContent CardsはBrazeの製品機能であり、Alloysのテクノロジーカテゴリーではありません。", "links": [{ "text": "Alloysテクノロジーパートナー", "url": "https://www.braze.com/docs/partners/home?utm_source=operator_user&utm_medium=dashboard" }] }, 
			{ "id": 14, "type": "単一選択", "question": "あなたの金融サービスアプリケーションはBrazeを使用しており、最近、顧客に初めてのカード取引を促すことを目的としたキャンペーンを開始しました。キャンペーンの目標に関連して、あなたのブランドが監視するのに最も適切で意味のある瞬間（イベント）はどれですか？", "choices": { "A": "顧客がウェルカムメッセージをクリックする", "B": "顧客がカードを有効化する", "C": "顧客がローンを返済する", "D": "顧客が肯定的なレビューを残す" }, "correct": ["B"], "explanation": "回答\nB. 顧客がカードを有効化する\n解説\nコンバージョンイベントは、キャンペーンの目的に直結する高価値な行動を追跡するために設定します。\n初回カード取引を促すキャンペーンでは、カードの有効化は取引前に必要となる、目的に最も近い意味のある行動です。\nA はメッセージ自体へのエンゲージメントであり、カード利用の進展を示しません。\nC と D はこのキャンペーン目標に関連しません。", "links": [{ "text": "コンバージョンイベント", "url": "https://www.braze.com/docs/user_guide/messaging/messaging_fundamentals/conversion_events?utm_source=operator_user&utm_medium=dashboard" }] }, 
			{ "id": 15, "type": "単一選択", "question": "あなたのチームは、Brazeでユーザーデータのデータディクショナリー（辞書）を作成しました。このディクショナリーには、名前、説明、カスタムフィールドタイプ、データのインポート元など、各ユーザーデータ要素に関する重要な詳細が含まれています。\n次のユーザーデータ要素について、正しいカスタムフィールドタイプとインポートソースを特定してください。\n要素名：お気に入りのブランド\n定義：このデータは、ウェブサイトのユーザーに表示されるオンボーディングアンケートから収集されます。", "choices": { "A": "SDKによるカスタム属性", "B": "SDK経由のカスタムイベント", "C": "SDKによる標準属性項目", "D": "API経由の購入イベント" }, "correct": ["A"], "explanation": "回答\nA. SDKによるカスタム属性\n解説\n「お気に入りのブランド」は、ユーザーの継続的な好みを表すブランド固有のプロファイルデータです。そのためカスタム属性として保存します。\n収集元はウェブサイトのオンボーディングアンケートなので、Web SDKからカスタム属性を設定します。複数ブランドを選べる場合は配列型にできます。", "links": [{ "text": "SDKでユーザー属性を設定", "url": "https://www.braze.com/docs/developer_guide/analytics/setting_user_attributes?utm_source=operator_user&utm_medium=dashboard" }, { "text": "カスタム属性", "url": "https://www.braze.com/docs/user_guide/data/activation/attributes/custom_attributes?utm_source=operator_user&utm_medium=dashboard" }] }, 
			{ "id": 16, "type": "単一選択", "question": "あなたのチームはBrazeでターゲットとする顧客ペルソナを作成しています。ペルソナの優先事項は「パワーユーザー」です。ペルソナを構築するには、どのセグメント条件を検討すべきですか？", "choices": { "A": "過去7日間にアプリとサイトを3回を超えて使用し、メッセージングチャネルに登録している。", "B": "過去7日間にメールの配信を停止し、過去30日間にアプリを使用していない。", "C": "メールに最後に反応したのが60日以上前のもので、「push enabled」は「false」である。", "D": "最後に購入したのは365日以上前で、最後にアプリを使用したのは60日以上前である。" }, "correct": ["A"], "explanation": "回答\nA. 過去7日間にアプリとサイトを3回を超えて使用し、メッセージングチャネルに登録している。\n解説\nパワーユーザーは、最近かつ頻繁にサービスを利用しているユーザーとして定義するのが適切です。\nこの条件は、次を組み合わせています。\n直近7日間で3回超の利用: 高い利用頻度\nメッセージングチャネルへの登録: 到達可能なユーザー\nB・C・D は、配信停止、長期間の未利用、低エンゲージメントなどを示しており、休眠または離脱リスクのあるユーザー向けの条件です。", "links": [{ "text": "セグメンテーションフィルター", "url": "https://www.braze.com/docs/user_guide/audience/segments/segmentation_filters?utm_source=operator_user&utm_medium=dashboard" }] },

			{ "id": 18, "type": "単一選択", "question": "あなたは、ユーザーがプラットフォームのメンバーシップをキャンセルしようとしたときに表示されるアプリ内メッセージ（IAM）を開始することを計画しています。このIAMは「Cancellation_Attempt」というイベントによってトリガーされ、そのIAMをリアルタイムでトリガーしたいと考えています。イベント「Cancellation_Attempt」をインポートしてリアルタイムトリガー条件を満たすには、どの方法を使用する必要がありますか？", "choices": { "A": "CSVアップロード", "B": "Braze Currents", "C": "クラウドデータ取り込み（CDI）", "D": "Braze SDK" }, "correct": ["D"], "explanation": "回答\nD. Braze SDK\n解説\nアプリ内メッセージをカスタムイベントでリアルタイムにトリガーするには、イベントをBraze SDKで記録する必要があります。\nCancellation_Attempt をSDKからログすると、そのイベントをトリガーにしたIAMが端末上で表示されます。\nCSVアップロード と CDI はこの端末上のリアルタイムIAMトリガーには適しません。\nCurrents はBrazeから外部システムへのイベントデータ出力です。", "links": [{ "text": "SDKでアプリ内メッセージをトリガー", "url": "https://www.braze.com/docs/developer_guide/in_app_messages/triggering_messages?utm_source=operator_user&utm_medium=dashboard" }] }, 
			{ "id": 19, "type": "単一選択", "question": "あなたのクリエイティブチームは、プッシュメッセージに含める画像のオプションを複数作成しました。あなたは、どの画像がコンバージョン率を高めるのに最も効果的かをテストしたいと考えています。このテストをBrazeでどのように設定しますか？", "choices": { "A": "コネクテッドコンテンツを使用して、API経由でプッシュ画像を取り込む。", "B": "インテリジェントタイミングを実装して、1日のさまざまな時間に同じ画像を送信する。", "C": "このキャンペーンの追加フィルターとして、インテリジェントチャネルを適用する。", "D": "各バリアントが異なるプッシュ画像である、多変量テストを開発する。" }, "correct": ["D"], "explanation": "回答\nD. 各バリアントが異なるプッシュ画像である、多変量テストを開発する。\n解説\nプッシュキャンペーンでは、画像を変えた複数のバリアントを作成し、コンバージョン率を比較できます。\n画像だけを変える場合はA/Bテストとしても扱えますが、選択肢では多変量テストが該当します。コンバージョンイベントを設定し、各画像バリアントの成果を評価します。", "links": [{ "text": "多変量テストとA/Bテストの作成", "url": "https://www.braze.com/docs/user_guide/messaging/ab_testing/create_tests?utm_source=operator_user&utm_medium=dashboard" }] }, 
			{ "id": 20, "type": "複数選択", "question": "Brazeにインポートできるカスタム属性の有効なデータタイプはどれですか？（3つ選択してください。）", "choices": { "A": "ユーザーID", "B": "配列", "C": "文字列", "D": "時間", "E": "API" }, "correct": ["B", "C", "D"], "explanation": "回答\nB. 配列\nC. 文字列\nD. 時間\n解説\nいずれもBrazeでカスタム属性として保存できる有効なデータ型です。\n配列: 複数の値のリスト\n文字列: テキスト値\n時間: 日付と時刻\nユーザーID はユーザーを識別する標準フィールドです。\nAPI はデータ型ではなく、データ取り込み方法です。", "links": [{ "text": "カスタムデータのデータ型", "url": "https://www.braze.com/docs/user_guide/data/activation/custom_data/data_types?utm_source=operator_user&utm_medium=dashboard" }] }, 
			{ "id": 21, "type": "複数選択", "question": "ユーザー行動イベントとして分類されるオプションはどれですか？（3つ選択してください。）", "choices": { "A": "アプリ内インプレッション", "B": "メールクリック", "C": "カスタムイベント", "D": "セッション", "E": "購入" }, "correct": ["C", "D", "E"], "explanation": "回答\nC. カスタムイベント\nD. セッション\nE. 購入\n解説\nこれらは、ユーザーがアプリやWebサイト内で行った行動として記録されるイベントです。\nカスタムイベント：商品閲覧、チュートリアル完了など、事業に合わせて定義する行動\nセッション：ユーザーがアプリを開いて利用を開始または終了した行動\n購入：ユーザーが商品やサービスを購入した行動\n一方、アプリ内インプレッションとメールクリックは、配信済みメッセージへの反応を表すメッセージエンゲージメントイベントです。", "links": [{ "text": "イベント", "url": "https://www.braze.com/docs/user_guide/data/activation/events?utm_source=operator_user&utm_medium=dashboard" }, { "text": "顧客行動およびユーザーイベント", "url": "https://www.braze.com/docs/user_guide/data/distribution/braze_currents/event_glossary/customer_behavior_events?utm_source=operator_user&utm_medium=dashboard" }] }, 
			{ "id": 22, "type": "複数選択", "question": "あなたのチームは、Brazeで追跡されるすべてのイベントの信頼できる情報源となるハブを設計しています。その一環として、データディクショナリーをまとめています。イベントの命名規則の作成においてBrazeが推奨するベストプラクティスを3つ挙げてください。（3つ選択してください。）", "choices": { "A": "イベント名の大文字と小文字を区別し、形式には一貫性を持たせる。", "B": "イベントに同じような名前を付けることを避ける。", "C": "命名規則を明確にする。", "D": "長いイベント属性文字列を作成する。", "E": "イベント名を作成日別にグループ化する。" }, "correct": ["A", "B", "C"], "explanation": "回答\nA. イベント名の大文字と小文字を区別し、形式には一貫性を持たせる。\nB. イベントに同じような名前を付けることを避ける。\nC. 命名規則を明確にする。\n解説\nイベント名は、誰が見ても用途を理解できるように明確かつ一貫した形式で管理します。\n大文字と小文字、区切り文字、単語順などの形式を統一します。\n似た名前のイベントを複数作ると、誤ったイベントでセグメントやトリガーを設定する原因になります。\n命名規則を明確にし、データディクショナリーに記録します。\nDの長いイベント属性文字列は、Brazeダッシュボードで切り詰められる可能性があるため推奨されません。Eの作成日によるグループ化も推奨事項ではありません。", "links": [{ "text": "イベント命名規則", "url": "https://www.braze.com/docs/user_guide/data/activation/events/event_naming_conventions?utm_source=operator_user&utm_medium=dashboard" }] }, 
			{ "id": 23, "type": "単一選択", "question": "月間アクティブユーザー数（MAU）にはどのタイプのユーザーが含まれますか？", "choices": { "A": "匿名ユーザー", "B": "非アクティブユーザー", "C": "解約したユーザー", "D": "アプリをダウンロードしたものの、アプリを開かなかったユーザー" }, "correct": ["A"], "explanation": "回答\nA. 匿名ユーザー\n解説\nMAUは、過去30日間にアプリまたはサイトで少なくとも1回セッションを記録したユーザー数です。匿名ユーザーも、セッションが記録されていればMAUに含まれます。\n非アクティブユーザー、解約済みユーザー、アプリをダウンロードしただけで開いていないユーザーは、セッションがないためMAUには含まれません。", "links": [{ "text": "ホームダッシュボード：月間アクティブユーザー数", "url": "https://www.braze.com/docs/user_guide/analytics/dashboards/home?utm_source=operator_user&utm_medium=dashboard#monthly-active-users" }] }, 
			{ "id": 24, "type": "複数選択", "question": "ユーザーがアプリ内で意味のあるアクションを実行したときに、そのユーザーにトランザクションメッセージを送信したいと考えています。Brazeでこのメッセージを表示するために使用できる方法はどれですか？（2つ選択してください。）", "choices": { "A": "スケジュール配信", "B": "APIキャンペーン", "C": "APIトリガー配信", "D": "アクションベースの配信" }, "correct": ["C", "D"], "explanation": "回答\nC. APIトリガー配信\nD. アクションベースの配信\n解説\nアクションベースの配信：カスタムイベント、購入、セッション開始など、Brazeで追跡されたユーザー行動をトリガーにメッセージを送信します。トランザクションメッセージに適しています。\nAPIトリガー配信：自社のサーバーやシステムからBraze APIを呼び出して、特定のユーザーにメッセージを送信します。より高度なトランザクション用途に適しています。\nスケジュール配信は指定した日時に送る方式です。APIキャンペーンはAPIトリガー配信とは別の機能で、この用途の選択肢ではありません。", "links": [{ "text": "アクションベースの配信", "url": "https://www.braze.com/docs/user_guide/messaging/campaigns/schedule_your_campaign/triggered_delivery?utm_source=operator_user&utm_medium=dashboard" }, { "text": "APIトリガー配信", "url": "https://www.braze.com/docs/user_guide/messaging/campaigns/schedule_your_campaign/api_triggered_delivery?utm_source=operator_user&utm_medium=dashboard" }] }, 
			{ "id": 25, "type": "単一選択", "question": "あなたのチームは、どのデータがあなたのBrazeの使用に最も関連があるかを分析しています。目標は、キャンペーン、キャンバス、またはセグメントで使用されていない属性やイベントをクリーンアップすることです。あなたは、利用されていない属性やイベントの追跡を停止したいと考えています。この機能を活用すべきですか？", "choices": { "A": "フリークエンシーキャップ", "B": "イベントの命名", "C": "ブロックリスト", "D": "ユーザーエイリアス" }, "correct": ["C"], "explanation": "回答\nC. ブロックリスト\n解説\nブロックリストを使用すると、不要になったカスタム属性、カスタムイベント、購入イベントについて、今後Brazeが新しいデータを処理・記録しないようにできます。\n既存のデータは保持されますが、未使用データの追跡を停止できます。完全に削除したい場合は、ブロックリストに登録した後で削除します。\n注意点として、ブロックリストに登録した属性またはイベントを使用するセグメント、キャンペーン、キャンバスはアーカイブされます。", "links": [{ "text": "カスタムデータのブロックリスト", "url": "https://www.braze.com/docs/user_guide/data/activation/custom_data/blocklist_custom_data?utm_source=operator_user&utm_medium=dashboard" }] }, 
			{ "id": 26, "type": "単一選択", "question": "あなたは、メールキャンペーンを開始することを計画しています。メールには、少なくとも1回購入したことがあるお客様向けの15％オフの割引コードを含めます。お客様の過去の購入イベントデータは、まだBrazeにアップロードされていません。この履歴データは、割引コードメールのBrazeオーディエンスを作成するために使用されます。過去の購入イベントをBrazeにインポートするにはどの方法を使用すればよいですか？", "choices": { "A": "CSVアップロード", "B": "REST API", "C": "Currents", "D": "SDK" }, "correct": ["B"], "explanation": "回答\nB. REST API\n解説\n過去の購入履歴は、/users/track REST APIを使ってBrazeへ移行できます。Brazeでは、このエンドポイントを過去の購入データなどの履歴データの一括インポートに使用できます。\nCSVインポートはカスタムイベントとユーザー属性の取り込みに対応しますが、購入イベントの履歴移行にはREST APIを使用します。Currentsはデータのエクスポート用であり、SDKは通常アプリやWebサイトで発生するリアルタイムの行動追跡に使用します。", "links": [{ "text": "統合の概要：レガシーユーザーデータの移行", "url": "https://www.braze.com/docs/developer_guide/getting_started/integration_overview?utm_source=operator_user&utm_medium=dashboard#migrating-legacy-user-data" }, { "text": "ユーザーデータのインポート", "url": "https://www.braze.com/docs/user_guide/audience/manage_audience/import_users?utm_source=operator_user&utm_medium=dashboard" }] }, 
			{ "id": 27, "type": "単一選択", "question": "キャンバスコンポーネントのすべての機能を実装するためのキャンバスを構築しようとしています。条件分岐、メッセージステップ、ユーザー更新、遅延以外のキャンバスのコンポーネントにはどのようなものがありますか？", "choices": { "A": "プッシュ、オーディエンスパス、IAM、アクションパス、実験パス", "B": "IAM、プッシュ、オーディエンスパス、アクションパス、実験パス", "C": "オーディエンスパス、プッシュ、実験パス、オーディエンス同期", "D": "オーディエンスパス、アクションパス、実験パス、オーディエンス同期" }, "correct": ["D"], "explanation": "回答\nD. オーディエンスパス、アクションパス、実験パス、オーディエンス同期\n解説\nこれらはいずれもCanvasのコンポーネントです。\nオーディエンスパス：オーディエンス条件に応じてユーザーを分岐\nアクションパス：購入やメッセージ操作などの行動に応じて分岐\n実験パス：複数のパスを比較し、効果をテスト\nオーディエンス同期：外部広告プラットフォームのオーディエンスと同期\nプッシュとIAMは、Canvasの独立したコンポーネントではなく、メッセージステップで設定できるメッセージチャネルです。", "links": [{ "text": "Canvasコンポーネント", "url": "https://www.braze.com/docs/user_guide/messaging/canvas/canvas_components?utm_source=operator_user&utm_medium=dashboard" }] }, 
			{ "id": 28, "type": "単一選択", "question": "あなたは、最も重要なキャンペーンのパフォーマンス指標を自分自身に送信するために、毎週のエンゲージメントレポートをスケジュールしました。このデータを毎週使用して、主要なコンバージョンイベントであるセッション開始数の傾向を評価します。\nあなたは、セッションの開始数が前期間よりも少ないことに気付きました。この指標を発見した後の次のステップとして最も適切なものはどれですか？", "choices": { "A": "特別なプロモーションやフィードバックのリクエストをプッシュ通知で送信します。", "B": "セグメント分析トラッキングを使用して、個々のコホートのセッション開始数が増加しているか減少しているかを確認します。", "C": "新しいキャンペーンやキャンバスが、アプリの訪問数を増やしているかどうかを調査します。", "D": "エンゲージメントレポートの頻度を毎週ではなく毎日に増やします。" }, "correct": ["B"], "explanation": "回答\nB. セグメント分析トラッキングを使用して、個々のコホートのセッション開始数が増加しているか減少しているかを確認します。\n解説\nまず、どのユーザーコホートでセッション開始数が低下しているかを切り分けます。セグメント分析トラッキングを有効にすると、セグメント別のセッション数を時系列で確認できます。\n原因となっているコホートを特定してから、キャンペーンやCanvasの見直し、再エンゲージメント施策を検討するのが適切です。", "links": [{ "text": "セグメント分析トラッキング", "url": "https://www.braze.com/docs/user_guide/analytics/tracking/segment_analytics_tracking?utm_source=operator_user&utm_medium=dashboard" }, { "text": "エンゲージメントレポート", "url": "https://www.braze.com/docs/user_guide/analytics/reports/engagement_reports?utm_source=operator_user&utm_medium=dashboard" }] }, 
			{ "id": 29, "type": "単一選択", "question": "製品チームは最近、アプリの大規模なバグ修正をリリースしました。必要なバグ修正を適用するためにアプリをアップグレードする必要があることをユーザーに警告するために、5つのプッシュ通知を含むキャンバスを作成しました。プッシュ通知の内容を踏まえると、お勧めのコンバージョンイベントはどれですか？", "choices": { "A": "アプリがバックグラウンド状態に移行", "B": "アプリの削除", "C": "アプリを開く", "D": "アプリの更新" }, "correct": ["D"], "explanation": "回答\nD. アプリの更新\n解説\nコンバージョンイベントは、メッセージで促した高価値な行動を測定するために設定します。このCanvasはバグ修正のためのアプリ更新を促す内容なので、目的に直接対応するアプリの更新を設定します。\nBrazeでは、指定したアプリのバージョンがアップグレードされたときに、コンバージョンとして計測できます。", "links": [{ "text": "コンバージョンイベント", "url": "https://www.braze.com/docs/user_guide/messaging/messaging_fundamentals/conversion_events?utm_source=operator_user&utm_medium=dashboard" }] }, 
			{ "id": 30, "type": "複数選択", "question": "あなたは、新しいウェルカムジャーニーがパフォーマンス目標を達成しているかどうかを監視したいと考えています。新しいキャンバスのコンバージョンを追跡するために、どのアクションを実行できますか？（3つ選択してください。）", "choices": { "A": "最大4つのコンバージョンイベントを選択し、そのうちの1つをメインコンバージョンイベントとする。", "B": "キャンバスに入ってからコンバージョンイベントを実行するまでの時間を割り当てる。", "C": "キャンバスを起動した後はいつでもコンバージョンイベントを変更できる。", "D": "コンバージョンイベントとしてカスタムイベント（商品ページの閲覧やカートへの追加など）を選択する。", "E": "コンバージョンイベントとしてメッセージエンゲージメントイベント（メッセージの開封やクリックなど）を選択する。" }, "correct": ["A", "B", "D"], "explanation": "回答\nA. 最大4つのコンバージョンイベントを選択し、そのうちの1つをメインコンバージョンイベントとする。\nB. キャンバスに入ってからコンバージョンイベントを実行するまでの時間を割り当てる。\nD. コンバージョンイベントとしてカスタムイベント（商品ページの閲覧やカートへの追加など）を選択する。\n解説\nCanvasでは、最大4つのコンバージョンイベントを設定でき、最初に追加したイベントがメインコンバージョンイベントになります。あわせて、Canvasへのエントリーからコンバージョンとして計測するまでの期限を設定します。\nカスタムイベントもコンバージョンイベントとして選択可能です。たとえば、ウェルカムジャーニーならproduct_viewedやadded_to_cartなどを成果指標にできます。\nCanvasを起動した後は、コンバージョンイベントを変更できません。また、メッセージの開封やクリックはCanvasのコンバージョンイベントとして設定するものではありません。", "links": [{ "text": "コンバージョンイベント", "url": "https://www.braze.com/docs/user_guide/messaging/messaging_fundamentals/conversion_events?utm_source=operator_user&utm_medium=dashboard" }, { "text": "Canvasの作成", "url": "https://www.braze.com/docs/user_guide/messaging/canvas/create_a_canvas?utm_source=operator_user&utm_medium=dashboard" }] }, 
			{ "id": 31, "type": "単一選択", "question": "ある顧客が、プッシュキャンペーンの量を監視するためのエンゲージメントレポートを設定することを希望しています。エンゲージメントレポートを受け取るために、顧客がこれらのキャンペーンを適切に特定して整理するにはどうすればよいでしょうか？", "choices": { "A": "プッシュ通知が送信されたら、エンゲージメントレポートを含むアプリ内メッセージをトリガーする。", "B": "ユーザーがネイティブプロンプトを受け入れたときに、ソフトプッシュを使用してエンゲージメントレポートを受け取る。", "C": "プッシュ通知が送信されたら、エンゲージメントレポートを含むコンテンツカードをトリガーする。", "D": "これらのキャンペーンに「プッシュレポート」などのタグを追加し、エンゲージメントレポートを設定して、これらのタグ付きキャンペーンの日次レポートを送信する。" }, "correct": ["D"], "explanation": "回答\nD. これらのキャンペーンに「プッシュレポート」などのタグを追加し、エンゲージメントレポートを設定して、これらのタグ付きキャンペーンの日次レポートを送信する。\n解説\nエンゲージメントレポートでは、タグに基づいて対象のキャンペーンやCanvasを自動選択できます。対象のプッシュキャンペーンに共通タグを付けることで、新しく作成される対象キャンペーンもレポートに含められます。\nアプリ内メッセージ、ソフトプッシュ、コンテンツカードは、エンゲージメントレポートの対象キャンペーンを整理・抽出する方法ではありません。", "links": [{ "text": "エンゲージメントレポート", "url": "https://www.braze.com/docs/user_guide/analytics/reports/engagement_reports?utm_source=operator_user&utm_medium=dashboard" }] }, 
			{ "id": 32, "type": "複数選択", "question": "あなたは、プラットフォームでの1か月間の無料ストリーミングをユーザーにオファーするプッシュ通知を送信したいと考えています。このキャンペーンでは、カスタムイベント「watched_movie」の実行を終了したばかりのユーザーをターゲットにしようと思っています。ユーザーに対してイベント「watched_movie」をアップロードするには、どのインポート方法を使用できますか？（2つ選択してください。）", "choices": { "A": "SDK", "B": "Currents", "C": "CSVアップロード", "D": "REST API" }, "correct": ["A", "D"], "explanation": "回答\nA. SDK\nD. REST API\n解説\nwatched_movieのようにアプリ内で発生したカスタムイベントは、通常以下でBrazeへ送信します。\nSDK：ユーザーが映画を視聴し終えたタイミングで、アプリからイベントを記録\nREST API：サーバー側の処理からイベントを記録\nCurrentsはデータのエクスポート機能です。\nなお、現在はCSVアップロードでもカスタムイベントの一括インポートに対応しています。ただし、この設問のようなリアルタイムの行動トリガーでは、SDKまたはREST APIが出題意図に沿った選択です。", "links": [{ "text": "カスタムイベントの記録", "url": "https://www.braze.com/docs/developer_guide/analytics/logging_events?utm_source=operator_user&utm_medium=dashboard" }, { "text": "CSVインポート", "url": "https://www.braze.com/docs/user_guide/audience/manage_audience/import_users/csv_import?utm_source=operator_user&utm_medium=dashboard" }] }, 
			{ "id": 33, "type": "単一選択", "question": "あなたは、アプリを使用するメリットをユーザーに説明するオンボーディングジャーニーを構築することを計画しています。これはどのタイプのジャーニーですか？", "choices": { "A": "トランザクション", "B": "期間限定", "C": "販売促進", "D": "ライフサイクル" }, "correct": ["D"], "explanation": "回答\nD. ライフサイクル\n解説\nオンボーディングは、新規ユーザーにアプリの価値や使い方を伝え、初期利用を定着させるためのライフサイクルジャーニーです。\nトランザクション、期間限定、販売促進ではなく、ユーザーと長期的な関係を築くための施策に分類されます。", "links": [{ "text": "オンボーディングCanvasテンプレート", "url": "https://www.braze.com/docs/user_guide/messaging/templates/canvas_templates/braze_templates/onboarding?utm_source=operator_user&utm_medium=dashboard" }] },

			{ "id": 36, "type": "単一選択", "question": "あなたはeコマース事業を営んでおり、オンラインプラットフォームと実店舗両方からの購入データを持っています。どちらのタイプの購入でも、Brazeでメッセージングをトリガーする必要があります。これを実現するために推奨されるアプローチはどれですか？", "choices": { "A": "SDK経由でオンライン購入データを送信し、その後すべての購入データをAPI経由で送信する。", "B": "すべての購入データをSDK経由で送信する。", "C": "オンライン購入データをAPI経由で送信し、その他すべての購入データをSDK経由で送信する。", "D": "すべての購入データをAPI経由で送信する。" }, "correct": ["D"], "explanation": "回答\nD. すべての購入データをAPI経由で送信する。\n解説\nオンラインと実店舗の購入データを同じ方法でBrazeに取り込むには、REST APIの/users/trackを使用します。\nSDKはアプリやWebサイト上で発生した行動の記録に適していますが、実店舗のPOSなどアプリ外で発生する購入を直接記録できません。すべての購入をAPIから送信すれば、共通の購入イベントとしてセグメント、パーソナライズ、メッセージトリガーに利用できます。", "links": [{ "text": "購入イベント", "url": "https://www.braze.com/docs/user_guide/data/activation/events/purchase_events?utm_source=operator_user&utm_medium=dashboard" }, { "text": "eコマース推奨イベント", "url": "https://www.braze.com/docs/user_guide/data/activation/events/recommended_events?utm_source=operator_user&utm_medium=dashboard" }] }, 
			{ "id": 37, "type": "単一選択", "question": "Brazeパートナープログラムの名前はどれですか？", "choices": { "A": "Braze Coppers", "B": "Braze Metals", "C": "Braze Steel", "D": "Braze Alloys" }, "correct": ["D"], "explanation": "回答\nD. Braze Alloys\n解説\nBrazeのテクノロジーパートナープログラムはBraze Alloysです。データ、分析、パーソナライゼーション、広告などのパートナー連携を提供します。", "links": [{ "text": "Technology Partners", "url": "https://www.braze.com/docs/partners/home?utm_source=operator_user&utm_medium=dashboard" }] }, 
			{ "id": 38, "type": "複数選択", "question": "あなたは、IPウォームアップをサポートするために、ユーザーデータをBrazeにインポートすることを計画しています。ユーザーごとに、標準属性「email」と「email_subscribe」、カスタム属性「most_purchased_category」をアップロードします。\n属性データをBrazeにインポートする際に重要な2つのアクションはどれですか？（2つ選択してください。）", "choices": { "A": "すべてのユーザーに対してすべての属性が同時にアップロードされていることを確認する。", "B": "カスタム属性が、セグメンテーションフィルターなど、使用に適した正しいデータタイプであることを確認する。", "C": "変更されていない属性が各データインポートに含まれていることを確認する。", "D": "標準属性が、スペルと大文字と小文字の区別について、特定の命名規則に従っていることを確認する。" }, "correct": ["B", "D"], "explanation": "回答\nB. カスタム属性が、セグメンテーションフィルターなど、使用に適した正しいデータタイプであることを確認する。\nD. 標準属性が、スペルと大文字と小文字の区別について、特定の命名規則に従っていることを確認する。\n解説\nmost_purchased_categoryは、想定する使い方に合うデータ型で作成します。データ型によって、利用できるセグメンテーションフィルターが変わります。\nまた、emailやemail_subscribeなどの標準属性は、属性名のスペルと大文字小文字を完全に一致させる必要があります。一致しない場合、Brazeでは標準属性ではなくカスタム属性として扱われます。\n全属性を一度にアップロードする必要はなく、変更されていない属性を毎回含める必要もありません。", "links": [{ "text": "CSVインポート", "url": "https://www.braze.com/docs/user_guide/audience/manage_audience/import_users/csv_import?utm_source=operator_user&utm_medium=dashboard" }, { "text": "標準属性", "url": "https://www.braze.com/docs/user_guide/data/activation/attributes/standard_attributes?utm_source=operator_user&utm_medium=dashboard" }] }, 
			{ "id": 39, "type": "複数選択", "question": "ストリーミングアプリケーションの主な焦点は、ユーザーをアプリに引き留め、引き付けることです。リテンション目標に合った「顧客にとっての重要な瞬間」を3つ選んでください。（3つ選択してください。）", "choices": { "A": "エピソードをお気に入りに追加する。", "B": "「後で見る」プレイリストを作成する。", "C": "アプリケーションをアンインストールする。", "D": "1週間あたり「X」回ストリーミングする。", "E": "SMSにオプトインする。" }, "correct": ["A", "B", "D"], "explanation": "回答\nA. エピソードをお気に入りに追加する。\nB. 「後で見る」プレイリストを作成する。\nD. 1週間あたり「X」回ストリーミングする。\n解説\nこれらは、ユーザーがコンテンツに関心を持ち、継続的にアプリを利用していることを示す行動です。リテンション施策のトリガーや成功指標として活用できます。\nアプリのアンインストールは離脱シグナル、SMSへのオプトインは配信許諾の状態であり、ストリーミング利用の定着を直接示す行動ではありません。", "links": [{ "text": "アクティブユーザーキャンペーン", "url": "https://www.braze.com/docs/user_guide/messaging/campaigns/ideas_and_strategies/active_user_campaigns?utm_source=operator_user&utm_medium=dashboard" }] }, 
			{ "id": 40, "type": "単一選択", "question": "あなたは、音楽ストリーミングアプリのマーケティング担当者です。ユーザーが「お気に入り」リストに曲を追加したときに、プッシュ通知を送信したいと考えています。あなたは、Liquidパーソナライゼーションを使用して、お気に入りの曲のタイトルをプッシュ通知に含めたいと思っています。このメッセージをトリガーしてパーソナライズするには、どのタイプのデータが必要ですか？", "choices": { "A": "「カスタムイベント：favoritedSong」＋イベントプロパティ：song_title", "B": "「カスタム属性：favoritedSong」＋イベントプロパティ：song_title", "C": "「カスタムイベント：favoritedSong」＋カスタム属性：song_title", "D": "「標準属性：favoritedSong」＋カスタム属性：song_title" }, "correct": ["A"], "explanation": "回答\nA. 「カスタムイベント：favoritedSong」＋イベントプロパティ：song_title\n解説\nfavoritedSongをカスタムイベントとして記録し、ユーザーが曲をお気に入りに追加したタイミングでアクションベースのプッシュをトリガーします。\n曲名はイベントプロパティsong_titleに含め、Liquidで参照します。\n{{event_properties.${song_title}}}\nカスタム属性はユーザープロフィールの状態を保存するデータであり、このような特定の行動を即時にトリガーして、その行動に紐づく曲名を表示する用途にはイベントプロパティが適しています。", "links": [{ "text": "カスタムイベントプロパティ", "url": "https://www.braze.com/docs/user_guide/data/activation/events/custom_events/custom_event_properties?utm_source=operator_user&utm_medium=dashboard" }] },

			{ "id": 42, "type": "単一選択", "question": "タグに関する記述のうち、正しいものはどれですか？", "choices": { "A": "タグは、エンゲージメント戦略を継続して追跡するのに便利な整理ツールです。", "B": "ユーザーエイリアスを識別子として使用する場合、タグは必須です。", "C": "タグを使用すると、Liquid経由でキャンペーンにパーソナライゼーションを追加できます。", "D": "external IDを設定するときは、タグをAPIリクエストに含める必要があります。" }, "correct": ["A"], "explanation": "回答\nA. タグは、エンゲージメント戦略を継続して追跡するのに便利な整理ツールです。\n解説\nタグはキャンペーン、Canvas、セグメントを整理・分類・検索するために使います。共通タグを付けることで、特定の施策群をまとめて確認したり、エンゲージメントレポートの対象を自動選択したりできます。\nユーザーエイリアスやexternal_idの設定には不要で、Liquidのパーソナライゼーション用データでもありません。", "links": [{ "text": "タグ", "url": "https://www.braze.com/docs/user_guide/messaging/governance/tags?utm_source=operator_user&utm_medium=dashboard" }] }, 
			{ "id": 43, "type": "単一選択", "question": "ユーザーがアプリ内のボタンをクリックしたときに、カスタムイベントに基づいてIAMをトリガーしたいと考えています。このカスタムイベントをBrazeに取り込む最適な方法はどれですか？", "choices": { "A": "SDK", "B": "API", "C": "CSVインポート", "D": "Webhook" }, "correct": ["A"], "explanation": "回答\nA. SDK\n解説\nアプリ内ボタンのクリックでカスタムイベントを記録し、そのイベントでIAMをトリガーする場合はSDKを使用します。\nカスタムイベントをトリガーにしたIAMは、SDKから送信されたイベントでのみ起動できます。REST API、CSVインポート、Webhookではこの用途に使えません。", "links": [{ "text": "IAMのトリガー", "url": "https://www.braze.com/docs/developer_guide/in_app_messages/triggering_messages?utm_source=operator_user&utm_medium=dashboard" }] },

// --- State ---
let phase = 'start'; // start | quiz | result
let questions = [];
let currentIdx = 0;
let selected = [];
let answered = false;
let results = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  questions = shuffle(QUESTIONS_DATA);
  currentIdx = 0;
  selected = [];
  answered = false;
  results = [];
  phase = 'quiz';
  render();
}

function toggleSelect(key) {
  if (answered) return;
  const q = questions[currentIdx];
  const isMulti = q.type === '複数選択';
  if (isMulti) {
    if (selected.includes(key)) selected = selected.filter(k => k !== key);
    else selected = [...selected, key];
  } else {
    selected = [key];
  }
  render();
}

function submitAnswer() {
  if (selected.length === 0) return;
  const q = questions[currentIdx];
  answered = true;
  const ok = [...selected].sort().join(',') === [...q.correct].sort().join(',');
  results.push({ correct: ok });
  render();
}

function nextQuestion() {
  if (currentIdx + 1 >= questions.length) {
    phase = 'result';
  } else {
    currentIdx++;
    selected = [];
    answered = false;
  }
  render();
}

function getChoiceClass(key) {
  const q = questions[currentIdx];
  if (!answered) return selected.includes(key) ? 'choice-btn selected' : 'choice-btn';
  if (q.correct.includes(key) && selected.includes(key)) return 'choice-btn correct';
  if (!q.correct.includes(key) && selected.includes(key)) return 'choice-btn wrong';
  if (q.correct.includes(key) && !selected.includes(key)) return 'choice-btn missed';
  return 'choice-btn';
}

function getChoiceIcon(key) {
  const q = questions[currentIdx];
  if (!answered) return '';
  if (q.correct.includes(key) && selected.includes(key)) return '<span class="choice-icon" style="color:#4caf50">✓</span>';
  if (!q.correct.includes(key) && selected.includes(key)) return '<span class="choice-icon" style="color:#ef5350">✗</span>';
  if (q.correct.includes(key) && !selected.includes(key)) return '<span class="choice-icon" style="color:#4caf50;opacity:0.7">✓</span>';
  return '';
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render() {
  const container = document.getElementById('appContainer');
  const progressWrap = document.getElementById('progressWrap');
  const progressLabel = document.getElementById('progressLabel');
  const progressFill = document.getElementById('progressFill');

  if (phase === 'start') {
    progressWrap.style.display = 'none';
    container.className = 'card start-card';
    container.innerHTML = `
      <div class="start-emoji">🎯</div>
      <div class="start-title">認定試験対策アプリ</div>
      <div class="start-sub">Braze Certified Marketing Strategy Expert<br>全${QUESTIONS_DATA.length}問・ランダム順で出題されます</div>
      <div class="start-stats">
        <div class="stat-item"><div class="stat-num">${QUESTIONS_DATA.length}</div><div class="stat-desc">問題数</div></div>
        <div class="stat-item"><div class="stat-num">単一＋複数</div><div class="stat-desc">問題形式</div></div>
        <div class="stat-item"><div class="stat-num">80%</div><div class="stat-desc">合格目安</div></div>
      </div>
      <button class="btn" onclick="startQuiz()">スタート →</button>
    `;
    return;
  }

  if (phase === 'result') {
    progressWrap.style.display = 'none';
    const total = questions.length;
    const correctCount = results.filter(r => r.correct).length;
    const pct = Math.round((correctCount / total) * 100);
    const emoji = pct >= 80 ? '🎉' : pct >= 60 ? '💪' : '📚';
    const gradeText = pct >= 80 ? '合格ライン到達！' : pct >= 60 ? 'もう少しで合格！' : '要復習';
    const gradeClass = pct >= 80 ? 'grade-badge grade-pass' : pct >= 60 ? 'grade-badge grade-near' : 'grade-badge grade-fail';
    container.className = 'card result-card';
    container.innerHTML = `
      <div class="result-emoji">${emoji}</div>
      <div class="result-score">${pct}%</div>
      <div class="result-label">正解率</div>
      <div class="${gradeClass}">${gradeText}</div>
      <div class="result-stats">
        <div class="stat-item"><div class="result-stat-num color-green">${correctCount}</div><div class="stat-desc">正解</div></div>
        <div class="stat-item"><div class="result-stat-num color-red">${total - correctCount}</div><div class="stat-desc">不正解</div></div>
        <div class="stat-item"><div class="result-stat-num color-white">${total}</div><div class="stat-desc">合計問題数</div></div>
      </div>
      <button class="btn" onclick="startQuiz()">もう一度チャレンジ →</button>
    `;
    return;
  }

  // Quiz phase
  const q = questions[currentIdx];
  const total = questions.length;
  const pct = (currentIdx / total) * 100;
  const isMulti = q.type === '複数選択';

  progressWrap.style.display = 'flex';
  progressLabel.textContent = `${currentIdx + 1} / ${total}`;
  progressFill.style.width = pct + '%';

  const choiceKeys = Object.keys(q.choices);
  const choicesHtml = choiceKeys.map(key => `
    <button class="${getChoiceClass(key)}" onclick="toggleSelect('${key}')" ${answered ? 'disabled' : ''}>
      <span class="choice-key">${key}</span>
      <span class="choice-text">${escapeHtml(q.choices[key])}</span>
      ${getChoiceIcon(key)}
    </button>
  `).join('');

  const explanationHtml = answered ? `
    <div class="explanation-box">
      <div class="explanation-title">📖 解説</div>
      <div class="explanation-text">${escapeHtml(q.explanation)}</div>
      ${q.links && q.links.length > 0 ? `
        <div class="links-title">参考リンク</div>
        <div class="links-wrap">
          ${q.links.map(l => `<a class="ref-link" href="${escapeHtml(l.url)}" target="_blank" rel="noopener noreferrer">🔗 ${escapeHtml(l.text)}</a>`).join('')}
        </div>
      ` : ''}
    </div>
  ` : '';

  const actionHtml = !answered
    ? `<button class="btn" onclick="submitAnswer()" ${selected.length === 0 ? 'disabled' : ''} style="${selected.length === 0 ? 'opacity:0.4' : ''}">回答する</button>`
    : `<button class="btn" onclick="nextQuestion()">${currentIdx + 1 >= total ? '結果を見る 🎯' : '次の問題 →'}</button>`;

  container.className = 'card';
  container.innerHTML = `
    <div class="question-meta">
      <span class="q-num">問題 ${currentIdx + 1}</span>
      <span class="type-badge ${isMulti ? 'type-multi' : 'type-single'}">${isMulti ? '複数選択' : '単一選択'}</span>
    </div>
    <div class="question-text">${escapeHtml(q.question)}</div>
    <div class="choices">${choicesHtml}</div>
    ${explanationHtml}
    <div class="action-row">${actionHtml}</div>
  `;
}

// Init
render();
</script>
